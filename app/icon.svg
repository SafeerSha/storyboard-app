<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sb-bg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="35%" stop-color="#C89F52"/>
      <stop offset="70%" stop-color="#B8944E"/>
      <stop offset="100%" stop-color="#87621E"/>
    </linearGradient>
    <linearGradient id="sb-glass" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="sb-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#2E2008" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8.5" fill="url(#sb-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" stroke="url(#sb-glass)" stroke-width="1"/>
  <!-- Left column: Epic stream -->
  <g filter="url(#sb-shadow)">
    <rect x="6.5" y="6.5" width="7.5" height="19" rx="2" fill="#FFFFFF" fill-opacity="0.96"/>
    <rect x="8" y="8.5" width="4.5" height="2" rx="0.8" fill="#B8944E" fill-opacity="0.9"/>
    <rect x="8" y="12" width="4.5" height="1.5" rx="0.6" fill="#87621E" fill-opacity="0.32"/>
    <rect x="8" y="15" width="4.5" height="1.5" rx="0.6" fill="#87621E" fill-opacity="0.32"/>
    <rect x="8" y="18" width="3" height="1.5" rx="0.6" fill="#87621E" fill-opacity="0.25"/>
  </g>
  <!-- Top right card -->
  <g filter="url(#sb-shadow)">
    <rect x="16" y="6.5" width="9.5" height="8.5" rx="2" fill="#FFFFFF" fill-opacity="0.93"/>
    <rect x="17.8" y="8.5" width="6" height="1.6" rx="0.7" fill="#B8944E" fill-opacity="0.9"/>
    <rect x="17.8" y="11.5" width="4.2" height="1.3" rx="0.6" fill="#87621E" fill-opacity="0.3"/>
  </g>
  <!-- Bottom right card with emerald checkmark -->
  <g filter="url(#sb-shadow)">
    <rect x="16" y="17" width="9.5" height="8.5" rx="2" fill="#FFFFFF" fill-opacity="0.97"/>
    <path d="M18.2 21.3 L19.8 23 L23.5 19" stroke="#2E8B70" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
